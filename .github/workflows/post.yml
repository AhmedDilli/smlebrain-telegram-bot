name: Post questions

on:
  schedule:
    # Starts the day's poster, which stays awake through 10 AM - 5 PM Riyadh
    # and posts at each exact minute (see daemon() in run.js). GitHub skips
    # many scheduled runs, so it tries every hour from 7:05 AM to 4:05 PM
    # Riyadh (UTC+3); one start a day is enough, and extra starts find the
    # work already done or waiting.
    - cron: '5 4-13 * * *'
  # "Run workflow" on the Actions tab: posts to one channel right away.
  # The poster also uses this to start its own replacement (daemon: true).
  workflow_dispatch:
    inputs:
      channel:
        description: Channel to post to (a name from channels.json)
        type: choice
        options: [smle, fm_part1, im_part1, peds_part1, gs_part1, er_part1]
        default: fm_part1
      count:
        description: How many posts to send now
        default: '1'
      daemon:
        description: Run as the day's poster instead (leave unticked)
        type: boolean
        default: false

permissions:
  contents: write # to commit state/ back
  actions: write # to start the next run

concurrency:
  group: telegram-post
  cancel-in-progress: false

jobs:
  post:
    runs-on: ubuntu-latest
    timeout-minutes: 350 # GitHub's limit is 360; the poster hands over at 330
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - run: npm ci --no-audit --no-fund

      - run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

      - name: Post questions
        run: node run.js
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHANNEL: ${{ secrets.TELEGRAM_CHANNEL }}
          FIREBASE_SERVICE_ACCOUNT: ${{ secrets.FIREBASE_SERVICE_ACCOUNT }}
          RESIDENCY_FIREBASE_SERVICE_ACCOUNT: ${{ secrets.RESIDENCY_FIREBASE_SERVICE_ACCOUNT }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          DAEMON: ${{ github.event_name == 'schedule' || github.event.inputs.daemon == 'true' }}
          MANUAL_CHANNEL: ${{ github.event.inputs.channel }}
          MANUAL_COUNT: ${{ github.event.inputs.count }}

      # Runs even if a post failed, so questions that did go out are never
      # posted again.
      - name: Remember what was posted
        if: always()
        run: |
          git add state
          if ! git diff --cached --quiet; then
            git commit -m "Record posted questions"
            git pull --rebase
            git push
          fi
