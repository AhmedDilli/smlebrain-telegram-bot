name: Inspect SDLE (read-only)
on:
  workflow_dispatch:
concurrency:
  group: inspect-sdle
jobs:
  inspect:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci --no-audit --no-fund
      - run: node tools/check-chat.js
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
      - run: node tools/inspect-sdle.js
        env:
          SDLE_FIREBASE_SERVICE_ACCOUNT: ${{ secrets.SDLE_FIREBASE_SERVICE_ACCOUNT }}
